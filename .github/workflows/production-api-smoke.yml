name: Production API Smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.env.production'
      - '.github/workflows/production-api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 https://sokak-api-production.up.railway.app/health)"
          echo "$body" | grep -q '"ok":true'

      - name: Storage readiness
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 https://sokak-api-production.up.railway.app/health/storage)"
          echo "$body" | grep -q '"ok":true'

      - name: Shared issues endpoint and CORS
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl --fail --silent --show-error             -D "$headers" -o "$body"             -H 'Origin: https://mehmetyildiz03.github.io'             https://sokak-api-production.up.railway.app/v1/issues
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!Array.isArray(data)) process.exit(1)" "$body"

      - name: Client-scoped read endpoint
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'X-Sokak-Client-Id: production-smoke-reader'             https://sokak-api-production.up.railway.app/v1/me/follows)"
          echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); if(!Array.isArray(x.issueIds)) process.exit(1)})"

      - name: Upload preflight
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error             -X OPTIONS -D "$headers" -o /dev/null             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,x-sokak-client-id'             https://sokak-api-production.up.railway.app/v1/uploads/photo
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -qi '^access-control-allow-methods: .*POST' "$headers"

      - name: Auth endpoint requires a session
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error             -D "$headers" -o "$body" -w '%{http_code}'             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'X-Sokak-Client-Id: production-auth-smoke'             https://sokak-api-production.up.railway.app/v1/auth/me)"
          test "$status" = "401"
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -q 'Oturum açman gerekiyor' "$body"

      - name: Auth preflight
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error             -X OPTIONS -D "$headers" -o /dev/null             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Access-Control-Request-Method: GET'             -H 'Access-Control-Request-Headers: authorization,x-sokak-client-id'             https://sokak-api-production.up.railway.app/v1/auth/me
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -qi '^access-control-allow-headers: .*Authorization' "$headers"

      - name: Moderation endpoint requires account
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -X POST             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Content-Type: application/json'             -H 'X-Sokak-Client-Id: production-moderation-smoke'             --data '{"targetType":"issue","targetId":"iss-smoke","reason":"spam"}'             https://sokak-api-production.up.railway.app/v1/moderation/reports)"
          test "$status" = "401"
          grep -q 'Oturum açman gerekiyor' "$body"

      - name: Moderation preflight
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error             -X OPTIONS -D "$headers" -o /dev/null             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,authorization,x-sokak-client-id'             https://sokak-api-production.up.railway.app/v1/moderation/reports
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -qi '^access-control-allow-headers: .*Authorization' "$headers"

      - name: Moderator queue requires account
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'X-Sokak-Client-Id: production-moderator-queue-smoke'             'https://sokak-api-production.up.railway.app/v1/moderation/reports?status=open')"
          test "$status" = "401"
          grep -q 'Oturum açman gerekiyor' "$body"

      - name: Moderator review requires account
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -X PATCH             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Content-Type: application/json'             -H 'X-Sokak-Client-Id: production-moderator-review-smoke'             --data '{"status":"reviewing","moderatorNote":"smoke"}'             https://sokak-api-production.up.railway.app/v1/moderation/reports/mod-smoke)"
          test "$status" = "401"
          grep -q 'Oturum açman gerekiyor' "$body"

      - name: Notifications list endpoint
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error             -D "$headers" -o "$body" -w '%{http_code}'             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'X-Sokak-Client-Id: production-notification-smoke'             'https://sokak-api-production.up.railway.app/v1/me/notifications?limit=5')"
          test "$status" = "200"
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -q '"unreadCount"' "$body"
          grep -q '"notifications"' "$body"

      - name: Notifications read-all endpoint
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -X POST             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Content-Type: application/json'             -H 'X-Sokak-Client-Id: production-notification-smoke'             https://sokak-api-production.up.railway.app/v1/me/notifications/read-all)"
          test "$status" = "200"
          grep -q '"updated"' "$body"

      - name: Notification item read endpoint rejects unknown id
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error             -o "$body" -w '%{http_code}'             -X PUT             -H 'Origin: https://mehmetyildiz03.github.io'             -H 'Content-Type: application/json'             -H 'X-Sokak-Client-Id: production-notification-smoke'             https://sokak-api-production.up.railway.app/v1/me/notifications/ntf-production-smoke/read)"
          test "$status" = "404"
          grep -q 'Bildirim bulunamadı' "$body"

      - name: Issue history endpoint
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error             -D "$headers" -o "$body" -w '%{http_code}'             -H 'Origin: https://mehmetyildiz03.github.io'             https://sokak-api-production.up.railway.app/v1/issues/iss-production-history-smoke/history)"
          test "$status" = "404"
          grep -qi '^access-control-allow-origin: https://mehmetyildiz03.github.io' "$headers"
          grep -q 'Sorun kaydı bulunamadı' "$body"
